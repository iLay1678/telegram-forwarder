name: Build and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: '1.26.4'
  GOGC: '30'
  GOMEMLIMIT: 2GiB
  GOFLAGS: -p=1

jobs:
  test:
    name: Test, vet and race
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Unit and compatibility tests
        run: go test ./...
      - name: Static checks
        run: go vet ./...
      - name: Race detector
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...

  binaries:
    name: Binary (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Compile and package
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          version="sha-${GITHUB_SHA:0:12}"
          if [[ "$REF_TYPE" == tag ]]; then version="$REF_NAME"; fi
          name="telegram-forwarder-${GOOS}-${GOARCH}"
          binary="telegram-forwarder"
          if [[ "$GOOS" == windows ]]; then binary="${binary}.exe"; fi
          mkdir -p "dist" "out"
          go build -trimpath \
            -ldflags="-s -w -X main.version=${version} -X main.commit=${GITHUB_SHA}" \
            -o "dist/${binary}" ./cmd/telegram-forwarder
          cp "LICENSE" "dist/LICENSE"
          if [[ "$GOOS" == windows ]]; then
            archive="${name}.zip"
            (cd "dist" && zip "../out/${archive}" "$binary" "LICENSE")
          else
            archive="${name}.tar.gz"
            tar -czf "out/${archive}" -C "dist" "$binary" "LICENSE"
          fi
          (cd "out" && sha256sum "$archive" > "${archive}.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: telegram-forwarder-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/*
          if-no-files-found: error

  image:
    name: Multi-platform container
    needs: [test, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: telegram-forwarder-linux-*
          path: artifacts
      - name: Verify and extract Linux binaries
        shell: bash
        run: |
          for arch in amd64 arm64; do
            name="telegram-forwarder-linux-${arch}"
            (cd "artifacts/${name}" && sha256sum -c "${name}.tar.gz.sha256")
            mkdir -p "dist/linux-${arch}"
            tar -xzf "artifacts/${name}/${name}.tar.gz" -C "dist/linux-${arch}" telegram-forwarder
            chmod 755 "dist/linux-${arch}/telegram-forwarder"
          done
          dist/linux-amd64/telegram-forwarder --version
      - name: Image name
        id: info
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.info.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
      - name: Build and optionally publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record image digest
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          IMAGE: ${{ steps.info.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Published ${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
